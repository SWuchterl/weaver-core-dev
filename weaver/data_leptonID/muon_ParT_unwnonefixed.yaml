treename: ntuplizer_muon/Events

selection:
   ### use `&`, `|`, `~` for logical operations on numpy arrays
   ### can use functions from `math`, `np` (numpy), and `awkward` in the expression
   # ((Lepton_pt > 5) & (np.abs(Lepton_eta) < 2.5))
   # ((Lepton_pt > 5) & (Lepton_pt < 1000) & (np.abs(Lepton_eta) < 2.4) & (event % 10 < 9)) # let's only use 90% for training
   ((Lepton_pt > 5) & (Lepton_pt < 1000) & (np.abs(Lepton_eta) < 2.4)) # let's only use 90% for training

test_time_selection:
   # ((Lepton_pt > 5) & (Lepton_pt < 1000) & (np.abs(Lepton_eta) < 2.4) & (event % 10 >= 9)) # use the remaining 10% of events for testing
   ((Lepton_pt > 5) & (Lepton_pt < 1000) & (np.abs(Lepton_eta) < 2.4)) # use the remaining 10% of events for testing

new_variables:
   ### [format] name: formula
   ### can use functions from `math`, `np` (numpy), and `awkward` in the expression
   # event_1: np.array(evt).astype('int64')
   prompt: (np.abs(genPartFlav) == 1)
   tau: (np.abs(genPartFlav) == 15)
   heavy: (np.abs(genPartFlav) == 5)
   light: (np.abs(genPartFlav) == 4) | (np.abs(genPartFlav) == 3)
   fake: (np.abs(genPartFlav) != 1) & (np.abs(genPartFlav) != 3) & (np.abs(genPartFlav) != 4) & (np.abs(genPartFlav) != 5) & (np.abs(genPartFlav) != 15) | (genPartFlav == 0)
   # get back the full miniIsoAll
   # https://github.com/SWuchterl/cmssw/blob/dev/CMSSW_15_0_17_leptonParT/PhysicsTools/NanoAOD/python/muons_cff.py
   Lepton_CustomMiniIsoAll: ((Lepton_miniRelIsoNeutral * Lepton_pt) + (Lepton_miniRelIsoCharged * Lepton_pt)) / Lepton_pt


preprocess:
   ### method: [manual, auto] - whether to use manually specified parameters for variable standardization
   method: manual
   ### data_fraction: fraction of events to use when calculating the mean/scale for the standardization
   data_fraction: 1

inputs:
   pf_features:
      length: 60
      pad_mode: wrap
      vars:
         ### [format 1]: var_name (no transformation)
         ### [format 2]: [var_name,
         ###              subtract_by(optional, default=None, no transf. if preprocess.method=manual, auto transf. if preprocess.method=auto),
         ###              multiply_by(optional, default=1),
         ###              clip_min(optional, default=-5),
         ###              clip_max(optional, default=5),
         ###              pad_value(optional, default=0)]
         - [PF_pt_log, 0, 0.5]
         - [PF_energy_glob_log, 0, 0.5]
         - [PF_charge, null]
         - [PF_isElectron, null]
         - [PF_isMuon, null]
         - [PF_isNeutralHadron, null]
         - [PF_isPhoton, null]
         - [PF_isChargedHadron, null]
         - [PF_fromPV, 2, 1]
         - [PF_puppiWeightNoLep, null]
         - [PF_dz_asinh, 0, 0.5]
         - [PF_dzsig_asinh, 0, 0.15]
         - [PF_dxy_asinh, null]
         - [PF_dxysig_asinh, 0, 0.5]
         - [PF_caloFraction, 0, 1, 0, 3]
         - [PF_hcalFraction, 0, 1, 0, 3]
         - [PF_lostInnerHits, 0, 0.25]
         - [PF_numberOfPixelHits, 0, 0.15]
         - [PF_trackerLayersWithMeasurement, 0, 0.05]
         - [PF_qoverp, 0., 0.1]
         - [PF_qdotp, 0, 0.1, -25, 25]
         - [PF_ass, 4, 0.1]
         - [PF_chi2, 1, 0.1]
         - [PF_quality, 0, 0.1]
         - [PF_phi_rel, null]
         - [PF_eta_rel, null]
         - [PF_dR_lep, null]
         - [PF_pt_rel_log, -4, 0.25]
   pf_vectors:
      length: 60
      pad_mode: wrap
      vars:
         - [PF_px_glob, null]
         - [PF_py_glob, null]
         - [PF_pz_glob, null]
         - [PF_energy_glob, null]
   pf_mask:
      length: 60
      pad_mode: constant
      vars:
         - [PF_mask, null]
   # ----------------------------------------------------
   lt_features:
      length: 6
      pad_mode: wrap
      vars:
         - [LT_pt_log, 0, 0.5]
         - [LT_energy_glob_log, 0, 0.5]
         - [LT_charge, null]
         - [LT_isElectron, null]
         - [LT_isMuon, null]
         - [LT_isNeutralHadron, null]
         - [LT_isPhoton, null]
         - [LT_isChargedHadron, null]
         - [LT_fromPV, 2, 1]
         # - [LT_puppiWeightNoLep, null]
         - [LT_dz_asinh, 0, 0.5]
         - [LT_dzsig_asinh, 0, 0.15]
         - [LT_dxy_asinh, null]
         - [LT_dxysig_asinh, 0, 0.5]
         # - [LT_caloFraction, 0, 1, 0, 3]
         # - [LT_hcalFraction, 0, 1, 0, 3]
         - [LT_lostInnerHits, 0, 0.25]
         - [LT_numberOfPixelHits, 0, 0.15]
         - [LT_trackerLayersWithMeasurement, 0, 0.05]
         - [LT_qoverp, 0., 0.1]
         - [LT_qdotp, 0, 0.1, -25, 25]
         - [LT_ass, 4, 0.1]
         - [LT_chi2, 1, 0.1]
         - [LT_quality, 0, 0.1]
         - [LT_phi_rel, null]
         - [LT_eta_rel, null]
         - [LT_dR_lep, null]
         - [LT_pt_rel_log, -4, 0.25]
   lt_vectors:
      length: 6
      pad_mode: wrap
      vars:
         - [LT_px_glob, null]
         - [LT_py_glob, null]
         - [LT_pz_glob, null]
         - [LT_energy_glob, null]
   lt_mask:
      length: 6
      pad_mode: constant
      vars:
         - [LT_mask, null]
   # ----------------------------------------------------
   sv_features: 
      length: 6
      vars: 
         - [SV_pt_log, 3, 0.5]
         - [SV_energy_glob_log, 3, 0.5]
         - [SV_mass_log, 0.5, 0.3]
         - [SV_d3d_asinh, 0, 0.15]
         - [SV_d3dsig_asinh, 3, 0.15]
         - [SV_dxy_asinh, 0, 0.15]
         - [SV_dxysig_asinh, 2, 0.15]
         - [SV_ndof, 2, 0.1]
         - [SV_chi2, 2, 0.1]
         - [SV_cospAngle, null]
         - [SV_nTracks, 3, 0.5]
         - [SV_eta_rel, null]
         - [SV_phi_rel, null]
         - [SV_chi2norm, 1, 0.25]

   sv_vectors:
      length: 6
      vars:
         - [SV_px_glob, null]
         - [SV_py_glob, null]
         - [SV_pz_glob, null]
         - [SV_energy_glob, null]

   sv_mask:
      length: 6
      vars: 
         - [SV_mask, null]
   # ----------------------------------------------------
   lepton_features:
      length: 1
      vars:
         - [Lepton_pt_log, 3, 0.5]
         - [Lepton_energy_log, 4, 0.5]
         - [Lepton_eta, null]
         - [Lepton_dxy_asinh, 0, 1]
         - [Lepton_dxy_sig_asinh, 0, 0.5]
         - [Lepton_dz_asinh, 0, 1]
         - [Lepton_dz_sig_asinh, 0, 0.5]
         - [Lepton_sip3d_asinh, 0, 1]
         - [Lepton_sip3d_sig_asinh, 0, 0.5]
         - [Lepton_segmentComp, null]
         # - [Lepton_jetPNet, null] #try without for now for less bias
         - [Lepton_jetPtRatio, null]
         - [Lepton_jetNDauChargedMVASel, 2, 0.5, -10, 10]
         # - [Lepton_miniRelIsoNeutral_log, -15, 0.1, -10, 10]
         # - [Lepton_miniRelIsoNeutral, null]
         - [Lepton_jetPtRelv2_log, 2, 0.5]
         # - [Lepton_miniRelIsoCharged_log, -15, 0.1, -10, 10]
         # - [Lepton_miniRelIsoCharged, null]
         # - [Lepton_pfRelIso03_all_log, -10, 0.1, -10, 10]
         # - [Lepton_pfRelIso03_all, 0, 0.1]
         # - [Lepton_mvaId, null] #try without for now for less bias
   lepton_vectors:
      length: 1
      vars:
         - [Lepton_px, null]
         - [Lepton_py, null]
         - [Lepton_pz, null]
         - [Lepton_energy, null]
   lepton_mask:
      length: 1
      vars:
         - [Lepton_mask, null]
   # ----------------------------------------------------

labels:
   ### type can be `simple`, `custom`
   ### [option 1] use `simple` for binary/multi-class classification, then `value` is a list of 0-1 labels
   type: simple
   # value: [prompt, tau, heavy, light, fake]
   value: [fake, prompt, tau, heavy, light]
   ### [option 2] otherwise use `custom` to define the label, then `value` is a map
   # type: custom
   # value:
   # target_mass: np.where(fj_isQCD, fj_genjet_sdmass, fj_gen_mass)

observers:
   # basics
   - Lepton_pt
   - Lepton_eta
   # all other IDs to compare
   - Lepton_ID_cutBasedLoose
   - Lepton_ID_cutBasedMedium
   - Lepton_ID_cutBasedMediumPrompt
   - Lepton_ID_cutBasedTight
   - Lepton_ID_mva
   - Lepton_ID_promptMVA
   - Lepton_ID_PNET_prompt
   - Lepton_ID_PNET_heavy
   - Lepton_ID_PNET_light
   - Lepton_ID_PNET_tau
   - Lepton_ID_ParT_prompt
   - Lepton_ID_ParT_heavy
   - Lepton_ID_ParT_light
   - Lepton_ID_ParT_tau
   - Lepton_ID_ParT_fake
   - Lepton_ID_ParTLL_prompt
   - Lepton_ID_ParTLL_heavy
   - Lepton_ID_ParTLL_light
   - Lepton_ID_ParTLL_tau
   - Lepton_ID_ParTLL_fake
   # something for selections
   # - Lepton_miniPFRelIso_all # I dont have..?
   - Lepton_CustomMiniIsoAll
   - Lepton_sip3d
   - Lepton_dxy
   - Lepton_dz
   - Lepton_ID_cutBasedLoose
   - Lepton_ID_cutBasedMedium
   - Lepton_ID_cutBasedTight


