treename: ntuplizer_electron/Events

selection:
   ### use `&`, `|`, `~` for logical operations on numpy arrays
   ### can use functions from `math`, `np` (numpy), and `awkward` in the expression
   # ((Lepton_pt > 5) & (np.abs(Lepton_eta) < 2.5))
   ((Lepton_pt > 5) & (Lepton_pt < 1000) & (np.abs(Lepton_eta) < 2.5) & (event % 10 < 9)) # let's only use 90% for training

test_time_selection:
   ((Lepton_pt > 5) & (Lepton_pt < 1000) & (np.abs(Lepton_eta) < 2.5) & (event % 10 >= 9)) # use the remaining 10% of events for testing

new_variables:
   ### [format] name: formula
   ### can use functions from `math`, `np` (numpy), and `awkward` in the expression
   # event_1: np.array(evt).astype('int64')
   prompt: (np.abs(genPartFlav) == 1)
   tau: (np.abs(genPartFlav) == 15)
   heavy: (np.abs(genPartFlav) == 5)
   light: (np.abs(genPartFlav) == 4) | (np.abs(genPartFlav) == 3)
   fake: (np.abs(genPartFlav) != 1) & (np.abs(genPartFlav) != 3) & (np.abs(genPartFlav) != 4) & (np.abs(genPartFlav) != 5) & (np.abs(genPartFlav) != 15) | (genPartFlav == 0)

   PF_dxysig_asinh_: np.nan_to_num(PF_dxysig_asinh, nan=0.0, posinf=5.0, neginf=-5.0)
   PF_dz_asinh_: np.nan_to_num(PF_dz_asinh, nan=0.0, posinf=5.0, neginf=-5.0)
   PF_dzsig_asinh_: np.nan_to_num(PF_dzsig_asinh, nan=0.0, posinf=5.0, neginf=-5.0)
   PF_dxy_asinh_: np.nan_to_num(PF_dxy_asinh, nan=0.0, posinf=5.0, neginf=-5.0)
   LT_dxysig_asinh_: np.nan_to_num(LT_dxysig_asinh, nan=0.0, posinf=5.0, neginf=-5.0)
   LT_dz_asinh_: np.nan_to_num(LT_dz_asinh, nan=0.0, posinf=5.0, neginf=-5.0)
   LT_dzsig_asinh_: np.nan_to_num(LT_dzsig_asinh, nan=0.0, posinf=5.0, neginf=-5.0)
   LT_dxy_asinh_: np.nan_to_num(LT_dxy_asinh, nan=0.0, posinf=5.0, neginf=-5.0)
   Lepton_mask_: np.zeros_like(Lepton_pt)

   Lepton_dxy_asinh_: np.nan_to_num(Lepton_dxy_asinh, nan=0.0, posinf=5.0, neginf=-5.0)
   Lepton_dxy_sig_asinh_: np.nan_to_num(Lepton_dxy_sig_asinh, nan=0.0, posinf=5.0, neginf=-5.0)
   Lepton_dz_asinh_: np.nan_to_num(Lepton_dz_asinh, nan=0.0, posinf=5.0, neginf=-5.0)
   Lepton_dz_sig_asinh_: np.nan_to_num(Lepton_dz_sig_asinh, nan=0.0, posinf=5.0, neginf=-5.0)
   Lepton_sip3d_asinh_: np.nan_to_num(Lepton_sip3d_asinh, nan=0.0, posinf=5.0, neginf=-5.0)
   Lepton_sip3d_sig_asinh_: np.nan_to_num(Lepton_sip3d_sig_asinh, nan=0.0, posinf=5.0, neginf=-5.0)

preprocess:
   ### method: [manual, auto] - whether to use manually specified parameters for variable standardization
   method: manual
   ### data_fraction: fraction of events to use when calculating the mean/scale for the standardization
   data_fraction: 1

inputs:
   pf_features:
      length: 50
      pad_mode: wrap
      vars:
         ### [format 1]: var_name (no transformation)
         ### [format 2]: [var_name,
         ###              subtract_by(optional, default=None, no transf. if preprocess.method=manual, auto transf. if preprocess.method=auto),
         ###              multiply_by(optional, default=1),
         ###              clip_min(optional, default=-5),
         ###              clip_max(optional, default=5),
         ###              pad_value(optional, default=0)]
         - [PF_pt_log, 0, 0.5]
         - [PF_energy_glob_log, 0, 0.5]
         - [PF_charge, null]
         - [PF_isElectron, null]
         - [PF_isMuon, null]
         - [PF_isNeutralHadron, null]
         - [PF_isPhoton, null]
         - [PF_isChargedHadron, null]
         - [PF_fromPV, 2, 1]
         - [PF_puppiWeightNoLep, null]
         - [PF_dz_asinh_, 0, 0.5]
         - [PF_dzsig_asinh_, 0, 0.25]
         - [PF_dxy_asinh_, 0, 1]
         - [PF_dxysig_asinh_, 0, 0.5]
         - [PF_caloFraction, 0, 1, 0, 3]
         - [PF_hcalFraction, 0, 1, 0, 3]
         - [PF_lostInnerHits, 0, 0.1]
         - [PF_numberOfPixelHits, 0, 0.1]
         - [PF_trackerLayersWithMeasurement, 0, 0.1]
         - [PF_qoverp, 0., 0.25]
         - [PF_qdotp, 0, 0.1, -25, 25]
         - [PF_ass, 4, 0.1]
         - [PF_chi2, 1, 0.2]
         - [PF_quality, 0, 0.2]
         - [PF_phi_rel, null]
         - [PF_eta_rel, 1.5, 0.5]
         - [PF_dR_lep, null]
         - [PF_pt_rel_log, -4, 0.5]
   pf_vectors:
      length: 50
      pad_mode: wrap
      vars:
         - [PF_px_glob, null]
         - [PF_py_glob, null]
         - [PF_pz_glob, null]
         - [PF_energy_glob, null]
   pf_mask:
      length: 50
      pad_mode: constant
      vars:
         - [PF_mask, null]
   # ----------------------------------------------------
   lt_features:
      length: 6
      pad_mode: wrap
      vars:
         - [LT_pt_log, 0, 0.5]
         - [LT_energy_glob_log, 0, 0.5]
         - [LT_charge, null]
         - [LT_isElectron, null]
         - [LT_isMuon, null]
         - [LT_isNeutralHadron, null]
         - [LT_isPhoton, null]
         - [LT_isChargedHadron, null]
         - [LT_fromPV, 2, 1]
         - [LT_puppiWeightNoLep, null]
         - [LT_dz_asinh_, 0, 0.5]
         - [LT_dzsig_asinh_, 0, 0.25]
         - [LT_dxy_asinh_, 0, 1]
         - [LT_dxysig_asinh_, 0, 0.5]
         - [LT_caloFraction, 0, 1, 0, 3]
         - [LT_hcalFraction, 0, 1, 0, 3]
         - [LT_lostInnerHits, 0, 0.1]
         - [LT_numberOfPixelHits, 0, 0.1]
         - [LT_trackerLayersWithMeasurement, 0, 0.1]
         - [LT_qoverp, 0., 0.25]
         - [LT_qdotp, 0, 0.1, -25, 25]
         - [LT_ass, 4, 0.1]
         - [LT_chi2, 1, 0.2]
         - [LT_quality, 0, 0.2]
         - [LT_phi_rel, null]
         - [LT_eta_rel, 1.5, 0.5]
         - [LT_dR_lep, null]
         - [LT_pt_rel_log, -4, 0.5]
   lt_vectors:
      length: 6
      pad_mode: wrap
      vars:
         - [LT_px_glob, null]
         - [LT_py_glob, null]
         - [LT_pz_glob, null]
         - [LT_energy_glob, null]
   lt_mask:
      length: 6
      pad_mode: constant
      vars:
         - [LT_mask, null]
   # ----------------------------------------------------
   sv_features: 
      length: 5
      vars: 
         - [SV_pt_log, 3, 0.5]
         - [SV_energy_glob_log, 3, 0.5]
         - [SV_mass, 1.5, 0.3]
         - [SV_d3d_asinh, 0, 1,]
         - [SV_d3dsig_asinh, 3, 1]
         - [SV_dxy_asinh, 0, 1]
         - [SV_dxysig_asinh, 2, 0.5]
         - [SV_ndof, 2]
         - [SV_chi2, 1, 0.5]
         - [SV_cospAngle, null]
         - [SV_nTracks, 3, 1]
         - [SV_eta_rel, null]
         - [SV_phi_rel, null]
         - [SV_chi2norm, 1, 0.5]

   sv_vectors:
      length: 5
      vars:
         - [SV_px_glob, null]
         - [SV_py_glob, null]
         - [SV_pz_glob, null]
         - [SV_energy_glob, null]

   sv_mask:
      length: 5
      vars: 
         - [SV_mask, null]
   # ----------------------------------------------------
   lepton_features:
      length: 1
      vars:
         - [Lepton_pt_log, 3, 0.5]
         - [Lepton_energy_log, 3, 0.5]
         - [Lepton_eta, null]
         - [Lepton_dxy_asinh_, 0, 1]
         - [Lepton_dxy_sig_asinh_, 0, 1]
         - [Lepton_dz_asinh_, 0, 1]
         - [Lepton_dz_sig_asinh_, 0, 1]
         - [Lepton_sip3d_asinh_, 0, 1]
         - [Lepton_sip3d_sig_asinh_, 0, 1]
         # - [Lepton_jetPNet, null] #try without for now for less bias
         - [Lepton_jetPtRatio, null]
         - [Lepton_jetNDauChargedMVASel, 2, 1, -10, 10]
         - [Lepton_miniRelIsoNeutral_log, -15, 0.1, -10, 10]
         # - [Lepton_jetPtRelv2_log, null]
         - [Lepton_miniRelIsoCharged_log, -15, 0.1, -10, 10]
         - [Lepton_pfRelIso03_all_log, -10, 0.1, -10, 10]
         # electron specific
         - [Lepton_passConversionVeto, null]
         - [Lepton_eoverp_log, null]
         - [Lepton_fbrem_log, null]
         - [Lepton_dr03HcalDepth1TowerSumEt_Rel, 0., 1, 0, 5]
         - [Lepton_supcl_phiWidth, null]
         - [Lepton_supcl_etaWidth, null]
         - [Lepton_sigmaiphiiphi, null]
         - [Lepton_sigmaietaieta, null]
         - [Lepton_e1x5bye5x5, null]
         - [Lepton_r9full, null]
         - [Lepton_hcaloverecal_log, -7, 0.1]
         - [Lepton_dEtaInSeed, null]
         - [Lepton_deltaetacltrkcalo, null]
         - [Lepton_closeTrackNLayers, 10, 0.1]
   lepton_vectors:
      length: 1
      vars:
         - [Lepton_px, null]
         - [Lepton_py, null]
         - [Lepton_pz, null]
         - [Lepton_energy, null]
   lepton_mask:
      length: 1
      vars:
         - [Lepton_mask, null]
   # ----------------------------------------------------

labels:
   ### type can be `simple`, `custom`
   ### [option 1] use `simple` for binary/multi-class classification, then `value` is a list of 0-1 labels
   type: simple
   value: [prompt, tau, heavy, light, fake]
   ### [option 2] otherwise use `custom` to define the label, then `value` is a map
   # type: custom
   # value:
   # target_mass: np.where(fj_isQCD, fj_genjet_sdmass, fj_gen_mass)

observers:
   # basics
   - Lepton_pt
   - Lepton_eta
   # all other IDs to compare
   - Lepton_ID_cutBasedLoose
   - Lepton_ID_cutBasedMedium
   - Lepton_ID_cutBasedMediumPrompt
   - Lepton_ID_cutBasedTight
   - Lepton_ID_mva
   - Lepton_ID_promptMVA
   - Lepton_ID_PNET_prompt
   - Lepton_ID_PNET_heavy
   - Lepton_ID_PNET_light
   - Lepton_ID_PNET_tau
   - Lepton_ID_ParT_prompt
   - Lepton_ID_ParT_heavy
   - Lepton_ID_ParT_light
   - Lepton_ID_ParT_tau
   - Lepton_ID_ParT_fake

weights:
   ### [option 1] use precomputed weights stored in the input files
   #use_precomputed_weights: true
   #weight_branches: [renormWeight]
   ### [option 2] compute weights on-the-fly using reweighting histograms
   use_precomputed_weights: false
   # reweight_basewgt:
   reweight_method: flat
   reweight_threshold: 0
   reweight_vars: 
      # Lepton_eta: [-2.5, -2.0, -1.5, -1.0, -0.5, 0.0, 0.5, 1.0, 1.5, 2.0, 2.5]
      # Lepton_pt: [5, 15, 25, 30, 38, 48, 60, 76, 97, 122, 154, 195, 246, 311, 393, 496, 627, 792, 1000]
      Lepton_eta: [-2.5, -1.0, 0.0, 1.0, 2.5]
      Lepton_pt: [-1, 1000]
   reweight_classes: [prompt, tau, heavy, light, fake]
   class_weights: [1, 1, 1, 1, 1]
   reweight_hists: